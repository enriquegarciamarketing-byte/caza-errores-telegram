name: Probar free con Amazon (temporal, no publica)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -q -r requirements.txt
      - env:
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
        run: |
          python - <<'PY'
          import json
          c = json.load(open("config.json"))
          c["amazon_channel"]["amazon_search"]["enabled"] = True
          c["amazon_channel"]["amazon_search"]["per_run"] = 30
          c["amazon_channel"]["silence_minutes"] = 0
          json.dump(c, open("config.json", "w"), ensure_ascii=False)
          PY
          python -u canal_nube.py --dry-run --ignore-limits 2>&1 | grep -E "Amazon \(API\)|✓|✗ amz|Candidatos" | head -80
