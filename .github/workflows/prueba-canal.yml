name: Resolver enlace (rama de pruebas, no publica)
on:
  push:
    branches: [probe-jl]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python tools/resolver_enlace.py "https://link.amazon/B0b6EnJWF" 2>&1 | tee prueba_privada.log
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B probe-log
          git add -f prueba_privada.log
          git commit -m "Registro enlace [skip ci]"
          git push -f origin probe-log
