name: Canal normal @cazachollos_com

on:
  # GitHub solo arranca esta tarea más o menos una vez por hora, así que cada ejecución busca ~55 min (antes 35: quedaban
  # ~25 min por hora sin bot, 11/11/2026): una pasada cada 2 min, o al minuto si quedaron chollos por publicar.
  # El script respeta el horario (07:00-23:50 Madrid) y los cupos, y para en cuanto el día se cierra.
  # Si arranca en la hora antes de las 07:00, espera y publica desde las 7 en punto (por eso el límite es de 100 min).
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba: no publica nada, solo muestra lo que haría"
        required: false
        type: boolean
        default: true
      test_private:
        description: "Hasta 3 ejemplos solo a tu chat privado, nunca al canal. Quita dry_run para enviarlos."
        required: false
        type: boolean
        default: false
      minutes:
        description: "Buscar y publicar durante estos minutos seguidos (vacío: una sola pasada)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: telegram-canal-normal
  cancel-in-progress: false

# Tu chat privado con el bot sale de este secreto y no se guarda en el repo (es público).
env:
  ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Cache del modelo de ampliación
        uses: actions/cache@v4
        with:
          path: ~/.cache/caza-chollos/models
          key: fsrcnn-x4-v1

      # Solo Amazon.es, con enlace al producto exacto y precio visto hace menos de una hora.
      - name: Buscar y publicar en el canal normal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.test_private }}" = "true" ]; then ARGS+=(--test-private); fi
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS+=(--minutes 55 --every 120 --busy-every 60); fi
          if [ -n "${{ inputs.minutes }}" ]; then ARGS+=(--minutes "${{ inputs.minutes }}" --every 120 --busy-every 60); fi
          python -u canal_nube.py "${ARGS[@]}" 2>&1 | tee state/canal_nube_last_run.log

      - name: Guardar memoria del canal normal
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_private != true)
        run: tools/guardar_memoria.sh "Actualizar memoria del canal normal" state/canal_nube.json state/canal_nube_last_run.log
