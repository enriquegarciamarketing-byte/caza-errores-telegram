name: Canal normal @cazachollos_com

on:
  schedule:
    - cron: "*/15 7-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba: no publica nada, solo muestra lo que haría"
        required: false
        type: boolean
        default: true
      test_private:
        description: "2-3 ejemplos solo al chat del admin, no al canal. Quita dry_run para enviarlos. No guarda memoria."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-canal-normal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Cache del modelo de ampliación
        uses: actions/cache@v4
        with:
          path: ~/.cache/caza-chollos/models
          key: fsrcnn-x4-v1

      - name: Buscar y publicar en el canal normal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.test_private }}" = "true" ]; then ARGS+=(--test-private); fi
          set -o pipefail
          python generic.py "${ARGS[@]}" 2>&1 | tee state/generic_last_run.log

      - name: Guardar memoria del canal normal
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_private != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/generic.json state/generic_last_run.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar memoria del canal normal [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --autostash && git push && break
              sleep $((2 ** i))
            done
          fi
