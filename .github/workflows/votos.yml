name: Votos del canal free

# Escucha sin parar los botones 👍/👎 de @cazachollos_com (votos.py, 17/11/2026) mientras el premium está en
# pausa: quien vota ve al momento «voto apuntado» y el contador del post sube. Cada ejecución escucha ~5 h 45 min;
# la programación horaria deja siempre otra en cola para coger el relevo. Con el premium en marcha sale al
# momento (los votos los recoge el escáner).
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos escuchando"
        required: false
        default: "345"

permissions:
  contents: write

concurrency:
  group: telegram-votos
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escuchar votos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u votos.py --escuchar --minutos "${{ inputs.minutos || '345' }}"
