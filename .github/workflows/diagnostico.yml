name: Diagnóstico jimmyleaks y API
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - env:
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
        run: mkdir -p state/diagnostico && python -u tools/diagnostico.py 2>&1 | tee state/diagnostico/log.txt || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/diagnostico && git commit -m "Diagnóstico [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
