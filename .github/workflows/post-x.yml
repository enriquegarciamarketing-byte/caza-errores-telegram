name: Post X caza chollos

on:
  workflow_dispatch:
    inputs:
      texto:
        description: "Texto del post de X ya escrito (te llega solo a tu chat privado con el bot). Vacío = lo monta el bot con el enlace"
        required: false
        type: string
        default: ""
      url:
        description: "Enlace o ASIN de Amazon. Sin texto, el bot saca precio y PVP de la API y monta el post en estilo alerta"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Tu chat privado con el bot sale de este secreto y no se guarda en el repo (es público).
env:
  ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Mandarte el texto de X
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEXTO: ${{ inputs.texto }}
          URL: ${{ inputs.url }}
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID || secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET || secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: |
          if [ -n "$TEXTO" ]; then
            python -u canal_nube.py --x-texto "$TEXTO" --x-url "$URL"
          else
            python -u canal_nube.py --x-auto "$URL"
          fi
