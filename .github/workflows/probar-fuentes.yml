name: Probar fuentes (rama de pruebas, no publica)
on:
  push:
    branches: [probe-fuentes]
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -u tools/probar_fuentes.py
