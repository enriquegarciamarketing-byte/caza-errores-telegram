name: Actualizar descripción y fijado del canal

on:
  workflow_dispatch:
  push:
    paths:
      - channel_info.json

permissions:
  contents: write

concurrency:
  group: telegram-scanner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Aplicar descripción y mensaje fijado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python channel_info.py 2>&1 | tee state/channel_info.log
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/channel_info.log channel_info.json
          if ! git diff --cached --quiet; then
            git commit -m "Resultado de actualizar el canal [skip ci]"
            git pull --rebase --autostash && git push
          fi
