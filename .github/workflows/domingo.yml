name: Repaso de canales del domingo

# Imagen + copy en cada canal recordando los otros dos (funnel Caza Errores → Caza Chollos → WhatsApp).
# A mano: «privado» manda las tres versiones a tu chat con el bot (nunca al canal).
# Programado (26/11/2026): cada domingo a las 20:40 de Madrid. Los dos crons caen hacia las 19:10 de Madrid en
# invierno y en verano; domingo.py --programado se queda solo con el que toca y espera hasta las 20:40.
on:
  schedule:
    - cron: "10 17 * * 0"
    - cron: "10 18 * * 0"
  workflow_dispatch:
    inputs:
      modo:
        description: "privado (prueba a tu chat) · canal (publica en los tres canales)"
        required: true
        type: choice
        options: [privado, canal]
        default: privado

permissions:
  contents: read

concurrency:
  group: domingo-repaso
  cancel-in-progress: false

jobs:
  repaso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publicar el repaso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PREMIUM_CHAT_ID: ${{ vars.PREMIUM_CHAT_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python -u domingo.py --programado; exit; fi
          MODO="${{ inputs.modo || 'privado' }}"
          if [ "$MODO" = "privado" ]; then python -u domingo.py --privado; else python -u domingo.py; fi
