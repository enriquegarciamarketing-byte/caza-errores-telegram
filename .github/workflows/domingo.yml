name: Repaso de canales del domingo

# Imagen + copy en cada canal recordando los otros dos (funnel Caza Errores → Caza Chollos → WhatsApp).
# Cada domingo a las 20:40 de Madrid, sí o sí (26/11/2026):
# - Seis crons repartidos entre las 18:10 y las 20:50 de Madrid (invierno y verano), por si GitHub se salta alguno.
#   El primero que entra espera hasta las 20:40 en punto y publica; el resto ve la marca (state/domingo.json) y no
#   repite. Si todos se retrasan, el que llegue después de las 20:40 publica en cuanto arranca.
# - Reserva: el canal free (que corre todo el día con relevo) lanza este workflow en modo «reserva» si a partir de
#   las 20:41 del domingo aún no hay marca.
# A mano: «privado» manda las tres versiones a tu chat con el bot (nunca al canal); «canal» publica ya.
on:
  schedule:
    - cron: "10 17 * * 0"
    - cron: "40 17 * * 0"
    - cron: "10 18 * * 0"
    - cron: "40 18 * * 0"
    - cron: "25 19 * * 0"
    - cron: "50 19 * * 0"
  workflow_dispatch:
    inputs:
      modo:
        description: "privado (prueba a tu chat) · canal (publica ya en los tres) · reserva (solo si hoy no ha salido)"
        required: true
        type: choice
        options: [privado, canal, reserva]
        default: privado

permissions:
  contents: write

concurrency:
  group: domingo-repaso
  cancel-in-progress: false

jobs:
  repaso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publicar el repaso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PREMIUM_CHAT_ID: ${{ vars.PREMIUM_CHAT_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python -u domingo.py --programado; exit; fi
          case "${{ inputs.modo }}" in
            privado) python -u domingo.py --privado ;;
            reserva) python -u domingo.py --reserva ;;
            *) python -u domingo.py ;;
          esac
      - name: Guardar la marca del domingo
        if: always()
        run: |
          [ -f state/domingo.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --mixed origin/main
            git add state/domingo.json
            git diff --cached --quiet && exit 0
            git commit -qm "Repaso del domingo publicado [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
