name: Escanear chollos automáticamente

on:
  schedule:
    # Cada 10 minutos, las 24 horas (las gangas respetan el horario nocturno del config).
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba: no publica nada, solo muestra lo que haría"
        required: false
        type: boolean
        default: true
      ignore_limits:
        description: "Ignorar cupos y horario nocturno (solo pruebas)"
        required: false
        type: boolean
        default: false
      test_private:
        description: "Prueba privada al chat del admin, no al canal. Quita dry_run para enviarla. No guarda memoria."
        required: false
        type: boolean
        default: false
      manual_id:
        description: "Publicar a mano: ID de Jimmyleaks"
        required: false
        type: string
        default: ""
      manual_link:
        description: "Publicar a mano: enlace corto de afiliado"
        required: false
        type: string
        default: ""
      edit_message:
        description: "Rehacer el texto de un post ya publicado (número de mensaje)"
        required: false
        type: string
        default: ""
      custom:
        description: "Post hecho a mano (JSON)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: telegram-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Buscar y publicar chollos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          MANUAL_ID: ${{ inputs.manual_id }}
          MANUAL_LINK: ${{ inputs.manual_link }}
          EDIT_MESSAGE: ${{ inputs.edit_message }}
          CUSTOM: ${{ inputs.custom }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.ignore_limits }}" = "true" ]; then ARGS+=(--ignore-limits); fi
          if [ "${{ inputs.test_private }}" = "true" ]; then ARGS+=(--test-private); fi
          if [ -n "$MANUAL_ID" ]; then ARGS+=(--manual-id "$MANUAL_ID"); fi
          if [ -n "$MANUAL_LINK" ]; then ARGS+=(--manual-link "$MANUAL_LINK"); fi
          if [ -n "$EDIT_MESSAGE" ]; then ARGS+=(--edit-message "$EDIT_MESSAGE"); fi
          set -o pipefail
          if [ -n "$CUSTOM" ]; then
            if [ "${{ inputs.test_private }}" = "true" ]; then
              echo "La prueba privada no admite un post custom: iría al canal." >&2
              exit 2
            fi
            python scanner.py --custom "$CUSTOM" 2>&1 | tee state/last_run.log
          else
            python scanner.py "${ARGS[@]}" 2>&1 | tee state/last_run.log
          fi

      # La prueba privada no debe dejar memoria en el repositorio.
      - name: Guardar memoria del escáner
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_private != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/scanner.json state/last_run.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar memoria del escáner [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 3
            done
          fi
