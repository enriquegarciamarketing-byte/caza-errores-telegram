name: Escanear chollos automáticamente

on:
  schedule:
    # GitHub retrasa mucho las tareas frecuentes y en la práctica arranca esta más o menos una vez por hora.
    # Por eso cada ejecución programada busca durante ~40 min: una pasada cada 2,5 min, las 24 horas
    # (los errores de precio salen a cualquier hora; las gangas respetan el horario nocturno del config).
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba: no publica nada, solo muestra lo que haría"
        required: false
        type: boolean
        default: true
      ignore_limits:
        description: "Ignorar cupos y horario nocturno (solo pruebas)"
        required: false
        type: boolean
        default: false
      test_private:
        description: "Prueba privada al chat del admin, no al canal. Quita dry_run para enviarla. No guarda memoria."
        required: false
        type: boolean
        default: false
      manual_id:
        description: "Publicar a mano: ID de Jimmyleaks"
        required: false
        type: string
        default: ""
      manual_link:
        description: "Publicar a mano: enlace corto de afiliado"
        required: false
        type: string
        default: ""
      edit_message:
        description: "Rehacer el texto de un post ya publicado (número de mensaje)"
        required: false
        type: string
        default: ""
      custom:
        description: "Post hecho a mano (JSON)"
        required: false
        type: string
        default: ""
      minutes:
        description: "Pasadas seguidas durante estos minutos (vacío: una sola pasada)"
        required: false
        type: string
        default: ""
      check_sources:
        description: "Solo comprueba Wallapop, Vinted y Milanuncios y termina, sin publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # La prueba privada no guarda memoria: va por su carril y no espera a la búsqueda larga.
  group: telegram-scanner${{ github.event_name == 'workflow_dispatch' && inputs.test_private && '-prueba' || '' }}
  cancel-in-progress: false

# Tu chat privado con el bot sale de este secreto y no se guarda en el repo (es público).
env:
  ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Buscar y publicar chollos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID || secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET || secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          MANUAL_ID: ${{ inputs.manual_id }}
          MANUAL_LINK: ${{ inputs.manual_link }}
          EDIT_MESSAGE: ${{ inputs.edit_message }}
          CUSTOM: ${{ inputs.custom }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.ignore_limits }}" = "true" ]; then ARGS+=(--ignore-limits); fi
          if [ "${{ inputs.test_private }}" = "true" ]; then ARGS+=(--test-private); fi
          if [ -n "$MANUAL_ID" ]; then ARGS+=(--manual-id "$MANUAL_ID"); fi
          if [ -n "$MANUAL_LINK" ]; then ARGS+=(--manual-link "$MANUAL_LINK"); fi
          if [ -n "$EDIT_MESSAGE" ]; then ARGS+=(--edit-message "$EDIT_MESSAGE"); fi
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS+=(--minutes 40 --every 150); fi
          if [ -n "${{ inputs.minutes }}" ]; then ARGS+=(--minutes "${{ inputs.minutes }}" --every 150); fi
          set -o pipefail
          if [ "${{ inputs.check_sources }}" = "true" ]; then
            python scanner.py --check-sources 2>&1 | tee state/last_run.log
          elif [ -n "$CUSTOM" ]; then
            if [ "${{ inputs.test_private }}" = "true" ]; then
              echo "La prueba privada no admite un post custom: iría al canal." >&2
              exit 2
            fi
            python scanner.py --custom "$CUSTOM" 2>&1 | tee state/last_run.log
          else
            python -u scanner.py "${ARGS[@]}" 2>&1 | tee state/last_run.log
          fi

      # La prueba privada no debe dejar memoria en el repositorio.
      - name: Guardar memoria del escáner
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.test_private != true && inputs.check_sources != true))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/scanner.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar memoria del escáner [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 3
            done
          fi
