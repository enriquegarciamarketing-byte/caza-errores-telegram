name: Probar alerta TV 98 pulgadas

# La alerta de verdad va dentro de "Escanear chollos automáticamente" (cada pasada).
# Esto es solo para probarla a mano: te manda a tu privado lo mejor que haya ahora, sin mínimo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Mandar prueba al privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u alertas.py --test
