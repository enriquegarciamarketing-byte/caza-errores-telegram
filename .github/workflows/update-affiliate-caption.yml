name: Actualizar enlace afiliado de Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edit-caption:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar el pie del post #11
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_edit_caption.py
