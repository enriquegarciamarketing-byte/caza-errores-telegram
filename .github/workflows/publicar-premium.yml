name: Post manual premium @caza_errores

# Enrique pasa el error a Claude; Claude saca precio, foto y copy de la ficha de Amazon y lanza esto.
# Tarjeta nueva (solo datos de Amazon, fecha y hora del precio, aviso de afiliado) + el copy tal cual.
# Para marcar uno como agotado: datos = {"agotado": <número de mensaje>}.
on:
  workflow_dispatch:
    inputs:
      datos:
        description: "JSON del post: link, asin, image, reference, current, when, copy"
        required: true
        type: string
      privado:
        description: "Mandarlo solo a tu chat privado (prueba). Desmárcalo para publicarlo en el canal premium."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: telegram-premium-manual
  cancel-in-progress: false

# Tu chat privado con el bot sale de este secreto y no se guarda en el repo (es público).
env:
  ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publicar el post manual premium
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATOS: ${{ inputs.datos }}
        run: |
          ARGS=("$DATOS")
          if [ "${{ inputs.privado }}" = "true" ]; then ARGS+=(--privado); fi
          python -u premium_manual.py "${ARGS[@]}"
      - name: Guardar memoria del premium manual
        if: always() && inputs.privado == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add state/premium_manual.json 2>/dev/null || exit 0
            git diff --cached --quiet && exit 0
            git commit -qm "Memoria premium manual [skip ci]"
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 3
          done
