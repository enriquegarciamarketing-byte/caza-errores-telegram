name: Resumen de la noche @cazachollos_com

on:
  schedule:
    # 23:30 en Madrid: 22:30 UTC en invierno y 21:30 UTC en verano. El script solo envía a las 23:xx y una vez al día.
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      test_private:
        description: "Mandar la prueba solo a tu chat privado (nunca al canal)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: telegram-canal-normal
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Resumen de las mejores ofertas del día
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ARGS=(--resumen)
          if [ "${{ inputs.test_private }}" = "true" ]; then ARGS+=(--test-private --ignore-limits); fi
          set -o pipefail
          python canal_nube.py "${ARGS[@]}" 2>&1 | tee state/resumen_last_run.log
      - name: Guardar memoria
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_private != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/canal_nube.json state/resumen_last_run.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Resumen de la noche [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --autostash && git push && break
              sleep $((2 ** i))
            done
          fi
