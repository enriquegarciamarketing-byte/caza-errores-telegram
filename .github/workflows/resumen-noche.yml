name: Resumen de la noche @cazachollos_com

on:
  schedule:
    # El resumen de las 23:59 lo manda el propio bot del canal (se queda despierto esperando la hora).
    # Esto son solo respaldos por si esa pasada fallara: 00:10, 00:25 y 00:40 de Madrid (invierno y verano).
    # El script solo envía entre las 23:59 y la 01:39, una vez por día, así que nunca sale repetido.
    - cron: "10,25,40 22,23 * * *"
  workflow_dispatch:
    inputs:
      test_private:
        description: "Mandar la prueba solo a tu chat privado (nunca al canal)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Grupo propio: así una ejecución larga del canal (o una en cola) nunca retrasa ni cancela el resumen.
  # La memoria se junta al guardar, y el canal ya no publica desde las 23:50.
  group: telegram-resumen-noche
  cancel-in-progress: false

# Tu chat privado con el bot sale de este secreto y no se guarda en el repo (es público).
env:
  ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Resumen de las mejores ofertas del día
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Para releer los precios del día con la API de Amazon (jimmyleaks bloquea a GitHub).
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
        run: |
          ARGS=(--resumen)
          if [ "${{ inputs.test_private }}" = "true" ]; then ARGS+=(--test-private --ignore-limits); fi
          set -o pipefail
          python -u canal_nube.py "${ARGS[@]}" 2>&1 | tee state/resumen_last_run.log
      - name: Guardar memoria
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_private != true)
        run: tools/guardar_memoria.sh "Resumen de la noche" state/canal_nube.json
