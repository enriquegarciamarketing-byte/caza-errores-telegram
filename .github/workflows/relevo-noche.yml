name: Relevo de noche (despierta el canal a las 6:30)

# Lo lanza el propio canal al cerrar (tools/relevo_canal.sh). Duerme hasta las 6:30 de Madrid y arranca
# el canal normal, que espera solo a las 7:00 para empezar a publicar. Así la mañana no depende del cron
# de GitHub, que a veces no lanza nada durante horas.

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: relevo-noche
  cancel-in-progress: true   # solo un relevo durmiendo a la vez; el más nuevo manda

jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Dormir hasta las 6:30 y despertar el canal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          objetivo=$(TZ=Europe/Madrid date -d "06:30" +%s)
          ahora=$(date +%s)
          [ "$objetivo" -le "$ahora" ] && objetivo=$(TZ=Europe/Madrid date -d "tomorrow 06:30" +%s)
          espera=$(( objetivo - ahora ))
          hm=$(TZ=Europe/Madrid date +%H%M); hm=$((10#$hm))
          if [ "$hm" -ge 630 ] && [ "$hm" -lt 2345 ]; then espera=0; fi   # ya es de día: arranca ya
          max=$(( 335 * 60 ))                                             # límite del job
          repo="repos/${GITHUB_REPOSITORY}/actions/workflows"
          if [ "$espera" -gt "$max" ]; then
            echo "Faltan $((espera / 60)) min para las 6:30: duermo $((max / 60)) y paso el relevo a otro."
            sleep "$max"
            gh api -X POST "$repo/relevo-noche.yml/dispatches" -f ref=main
            exit 0
          fi
          echo "Duermo $((espera / 60)) min hasta las 6:30."
          sleep "$espera"
          for i in 1 2 3; do
            gh api -X POST "$repo/scan-generic.yml/dispatches" -f ref=main \
              -f 'inputs[dry_run]=false' -f 'inputs[test_private]=false' -f 'inputs[minutes]=55' && { echo "Canal lanzado."; exit 0; }
            sleep $((15 * i))
          done
          exit 1
