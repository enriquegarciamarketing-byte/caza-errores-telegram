name: Post manual @cazachollos_com

on:
  workflow_dispatch:
    inputs:
      datos:
        description: "URL corta a resolver (rama temporal)"
        required: true
        type: string
      privado:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Resolver enlace
        env:
          DATOS: ${{ inputs.datos }}
        run: |
          python3 -c "import os,affiliate;print('FINAL', affiliate.resolve_redirects(os.environ['DATOS']))" || true
          curl -sIL -A 'Mozilla/5.0' "$DATOS" | grep -i '^location' || true
