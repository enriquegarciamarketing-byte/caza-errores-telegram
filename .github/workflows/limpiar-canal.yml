name: Limpiar posts antiguos @cazachollos_com (revisión Amazon)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe LIMPIAR para cambiar todos los posts antiguos del canal a «Oferta finalizada»"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-canal-normal
  cancel-in-progress: false

jobs:
  limpiar:
    if: inputs.confirmar == 'LIMPIAR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Limpiar el canal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -o pipefail
          python -u tools/limpiar_canal.py 2>&1 | tee state/limpieza_last_run.log
      - name: Guardar memoria
        if: always()
        run: tools/guardar_memoria.sh "Limpieza del canal para la revisión de Amazon" state/canal_nube.json state/limpieza_last_run.log
