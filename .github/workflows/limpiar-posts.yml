name: Limpiar posts del canal

# Uso puntual: quita etiquetas antiguas de posts ya publicados en @cazachollos_com y, si salieron con la
# tarjeta de la marca y la foto aparte, deja solo la foto del producto (como los posts nuevos).
on:
  workflow_dispatch:
    inputs:
      mensajes:
        description: "Números de mensaje del canal (los del post con texto), separados por comas"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-post-manual
  cancel-in-progress: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Limpiar los posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MENSAJES: ${{ inputs.mensajes }}
        run: |
          set -o pipefail
          python -u tools/limpiar_posts.py "$MENSAJES" 2>&1 | tee state/limpiar_last_run.log
      - name: Guardar memoria
        if: always()
        run: tools/guardar_memoria.sh "Limpiar posts" state/canal_nube.json state/limpiar_last_run.log
