name: Borrar posts del canal free

# Borra posts concretos de @cazachollos_com (por número de mensaje) y los quita de la memoria del canal.
on:
  workflow_dispatch:
    inputs:
      mensajes:
        description: "Números de mensaje del canal free, separados por comas"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-post-manual
  cancel-in-progress: false

jobs:
  borrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Borrar los posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u tools/borrar_posts.py "${{ inputs.mensajes }}"
      - name: Guardar memoria
        if: always()
        run: tools/guardar_memoria.sh "Borrar posts" state/canal_nube.json
