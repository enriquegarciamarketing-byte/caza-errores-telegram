name: Revisión semanal (a tu privado)

# Cada lunes por la mañana: qué ha hecho la semana, propuestas de cambios y borradores para X.
on:
  schedule:
    - cron: "13 7 * * 1"   # lunes 08:13 en España (invierno)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar en el log, sin enviar"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python -u revision_semanal.py ${{ inputs.dry_run && '--dry-run' || '' }}
